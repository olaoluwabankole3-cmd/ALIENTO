name: Android tester APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-tester.yml'
      - 'app.json'
      - 'package*.json'
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
permissions:
  contents: read
concurrency:
  group: android-tester-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      # The Expo template uses a debug signing key for local release builds.
      # This standalone APK is for direct device tests only.
      - name: Build standalone tester APK
        working-directory: android
        run: bash gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify APK signature, package and target SDK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.aliento.patient'" "$RUNNER_TEMP/badging.txt"
          target=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'/\1/p" "$RUNNER_TEMP/badging.txt")
          test "$target" -ge 36
      - uses: actions/upload-artifact@v4
        with:
          name: ALIENTO-android-tester
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
