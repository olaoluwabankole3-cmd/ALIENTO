name: ALIENTO mobile checks

on:
  push:
    branches:
      - feat/android-patient-app-20261024
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Test navigation and safety decisions
        run: npm test
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
      - name: Expo project diagnostics
        run: npx expo-doctor
